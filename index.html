<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control IoT</title>
    <!-- SDK de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; color: white; background-color: #d9534f; transition: 0.3s; }
        button.active { background-color: #5cb85c; }
        h2 { color: #333; }
        #estado-texto { font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Panel de Control</h2>
        <p>Estado Interruptor: <span id="estado-texto">CARGANDO...</span></p>
        <br>
        <button id="btnToggle" onclick="cambiarEstado()">ENCENDER / APAGAR</button>
    </div>

    <script>
        // Si hay un ID en la URL usa ese, si no, usa la ruta raíz por defecto
        const urlParams = new URLSearchParams(window.location.search);
        const deviceID = urlParams.get('id');

        const firebaseConfig = {
            databaseURL: "https://luces-campo-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Si hay ID escribe en /ID/led_estado, si no en /led_estado
        const dbPath = deviceID ? (deviceID + '/led_estado') : 'led_estado';
        const dbRef = database.ref(dbPath);

        const btnToggle = document.getElementById('btnToggle');
        const estadoTexto = document.getElementById('estado-texto');

        let estadoActual = false;

        // Escuchar cambios en tiempo real
        dbRef.on('value', (snapshot) => {
            estadoActual = snapshot.val() === true;
            if (estadoActual) {
                estadoTexto.innerText = "ENCENDIDO";
                estadoTexto.style.color = "green";
                btnToggle.classList.add("active");
            } else {
                estadoTexto.innerText = "APAGADO";
                estadoTexto.style.color = "red";
                btnToggle.classList.remove("active");
            }
        });

        // Alternar estado al hacer clic
        function cambiarEstado() {
            dbRef.set(!estadoActual);
        }
    </script>

</body>
</html>
